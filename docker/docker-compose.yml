services:
  xiaohongshu-mcp:
    # Docker Hub 镜像（默认）
    image: xpzouying/xiaohongshu-mcp
    # 阿里云镜像源（国内用户推荐，拉取更快）
    # image: crpi-hocnvtkomt7w9v8t.cn-beijing.personal.cr.aliyuncs.com/xpzouying/xiaohongshu-mcp
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    # Chrome has to flush the persistent profile to disk, and an action in
    # flight is waited out for up to 15s before the browser is closed.
    stop_grace_period: 20s
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CONFIG_HOME=/app/data/config
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # Deployment: xiaohongshu.com (default) or rednote.com. An account
      # registered outside China lives on rednote and cannot log into the
      # mainland site at all. The login tool records the choice in cookies.json,
      # so this only has to be set when starting from an empty data directory --
      # but setting it is free and it fails loudly if the two disagree.
      # - XHS_SITE=rednote
      # The image runs on UTC. The rednote preset follows the container's zone,
      # so an overseas deployment should name its real one; the browser's clock
      # ought to agree with the exit IP the site sees.
      # - TZ=Europe/London
    ports:
      - "18060:18060"
